[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graph-rag-demo"
version = "0.1.0"
description = "A local RAG baseline for Graph RAG demonstrations."
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "jieba>=0.42,<1",
    "langchain-text-splitters>=1,<2",
    "openai>=1,<2",
    "pgvector>=0.3,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "tiktoken>=0.8,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/graph_rag_demo"]
