services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: graph_rag_demo
      POSTGRES_USER: graph_rag
      POSTGRES_PASSWORD: graph_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01-init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graph_rag -d graph_rag_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
